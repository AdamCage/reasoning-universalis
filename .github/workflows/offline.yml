name: offline research checks

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.11.28
      - run: python -m pip install -r requirements-resumption.txt
      - name: root suite without a key
        env:
          PYTHONPATH: EpistemeOS/src
        run: python -m unittest discover -s tests -v
      - name: published evidence and acceptance locks
        env:
          PYTHONPATH: EpistemeOS/src
        run: |
          python -m stage2.evidence --verify evidence/stage2-2026-10-14.zip
          python -m stage3.evidence_audit evidence/stage2-2026-10-14.zip
          python design/verify_stage1.py --commit 68fc12da05000674e3d770a07e449c37a4fbc119
          python design/verify_stage2_acceptance.py
          python -m stage3.roster --check design/PILOT_SECTION_5_5_ROSTER.json
          python -m stage3.roster_v2 --check design/PILOT_SECTION_5_5_ROSTER_V2.json
          python -m stage3.roster_v3 --check design/PILOT_SECTION_5_5_ROSTER_V3.json
          python -m stage3.roster_v4 --check design/PILOT_SECTION_5_5_ROSTER_V4.json
      - name: replay published pilot v2 evidence without a key
        run: >-
          python -X utf8 scripts/reproduce_pilot_v2_recovery.py
          --manifest evidence/pilot-v2-recovery-2026-11-08/manifest.json
          --output .research/ci-pilot-v2-recovery
      - name: verify offline post-v2 design and empty human handoff
        run: |
          python -X utf8 scripts/build_post_v2_design.py --check
          python -X utf8 scripts/import_e0_human.py --check-package --package artifacts/e0-human-development-2026-11-08
      # Frozen numerical bytes were produced with CPython 3.12.11.
      # Keep the general suite above on the matrix interpreter.
      - name: replay published machine annotation with reference Python without a key
        run: >-
          uv run --no-project --python 3.12.11 python -X utf8 scripts/reproduce_machine_development.py
          --manifest evidence/machine-annotation-development-2026-11-08/manifest.json
          --output .research/ci-machine-annotation

  windows-resumption:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.28
      - run: python -m pip install -r requirements-resumption.txt
      - name: local handoff checks without a key
        run: >-
          python -m unittest tests.test_stage1_package
          tests.test_resumption_generator_audit tests.test_resumption_tasks
          tests.test_resumption_runner tests.test_resumption_analysis
          tests.test_resumption_statistical_validity tests.test_resumption_episteme
          tests.test_embedding_compat tests.test_embedding_pinned
          tests.test_local_evidence_export tests.test_local_reproduction -v
      - name: pilot v2 offline checks without a key
        run: >-
          python -m unittest tests.test_pilot_v2_tasks tests.test_pilot_v2_statistics
          tests.test_pilot_v2_runner tests.test_pilot_v2_integration -v
      - name: pilot v2 evidence and recovery checks
        run: >-
          python -m unittest tests.test_pilot_v2_evidence tests.test_pilot_v2_recovery -v
      - name: pilot v2 recovery reporting and answer audit
        run: >-
          python -m unittest tests.test_pilot_v2_recovery_report
          tests.test_pilot_v2_recovery_evidence tests.test_pilot_v2_answer_audit
          tests.test_pilot_v2_ledger_io_compat -v
      - run: python -m resumption.tasks --check
      - name: replay published pilot v2 evidence without a key
        run: >-
          python -X utf8 scripts/reproduce_pilot_v2_recovery.py
          --manifest evidence/pilot-v2-recovery-2026-11-08/manifest.json
          --output .research/ci-pilot-v2-recovery
      - name: post-v2 candidate and human handoff checks without a key
        run: |
          python -X utf8 -m unittest tests.test_post_v2_candidate tests.test_post_v2_design tests.test_e0_human_handoff -v
          python -X utf8 scripts/build_post_v2_design.py --check
          python -X utf8 scripts/import_e0_human.py --check-package --package artifacts/e0-human-development-2026-11-08
      - name: machine annotation offline safety checks without a key
        run: >-
          python -X utf8 -m unittest tests.test_machine_development_annotation
          tests.test_machine_development_runner tests.test_machine_development_summary
          tests.test_machine_development_evidence tests.test_machine_evidence_index
          tests.test_machine_vote_failure_audit -v
      - name: replay published machine annotation with reference Python without a key
        run: >-
          uv run --no-project --python 3.12.11 python -X utf8 scripts/reproduce_machine_development.py
          --manifest evidence/machine-annotation-development-2026-11-08/manifest.json
          --output .research/ci-machine-annotation
